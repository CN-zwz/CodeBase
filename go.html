<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>自动选择最快网站</title>
    <style>
        @keyframes ellipsis {
            0% {
                content: '.';
            }
            33% {
                content: '..';
            }
            66% {
                content: '...';
            }
        }

        .loading::after {
            content: '.';
            animation: ellipsis 1.5s infinite;
        }
    </style>
    <script>
        const websites = [
            'https://docs.zhongwz.top',
            'https://docs2.zhongwz.top',
            'https://docs4.zhongwz.top'
        ];
        const cacheTime = 1 * 60 * 60 * 1000;
        const timeout = 5000;

        async function testWebsiteSpeed() {
            const results = [];
            for (const website of websites) {
                try {
                    const controller = new AbortController();
                    const signal = controller.signal;
                    const id = setTimeout(() => controller.abort(), timeout);
                    const startTime = performance.now();
                    // 去除时间戳参数
                    const response = await fetch(`${website}/`, {
                        redirect: 'follow',
                        signal,
                        headers: {
                            'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/91.0.4472.124 Safari/537.36'
                        }
                    });
                    clearTimeout(id);
                    const endTime = performance.now();
                    const duration = endTime - startTime;
                    if (response.ok) {
                        const content = await response.text();
                        if (content.trim().length > 0) {
                            results.push({ website, duration });
                        }
                    } else {
                        console.error(`请求 ${website} 时返回状态码: ${response.status}`);
                    }
                } catch (error) {
                    if (error.name === 'AbortError') {
                        console.log(`${website} 请求超时`);
                    } else {
                        console.error(`请求 ${website} 时出错:`, error.message);
                    }
                }
            }
            results.sort((a, b) => a.duration - b.duration);
            return results.length > 0 ? results[0].website : 'https://docs2.zhongwz.top';
        }

        async function redirectToFastestWebsite() {
            const cachedData = localStorage.getItem('fastestWebsite');
            if (cachedData) {
                const { website, timestamp } = JSON.parse(cachedData);
                if (Date.now() - timestamp < cacheTime) {
                    window.location.href = website;
                    return;
                }
            }
            const fastestWebsite = await testWebsiteSpeed();
            localStorage.setItem('fastestWebsite', JSON.stringify({ website: fastestWebsite, timestamp: Date.now() }));
            window.location.href = fastestWebsite;
        }

        window.onload = () => {
            document.querySelector('.loading').textContent = '正在测试网站速度';
            redirectToFastestWebsite();
        };
    </script>
</head>

<body>
    <p class="loading"></p>
</body>

</html>
